paths:
  /#X-Amz-Target=KinesisAnalytics_20180523.StartApplication:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartApplication
      description: Starts the specified Kinesis Data Analytics application. After creating an application, you must exclusively call this operation to start your application.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartApplicationResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: ResourceInUseException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInUseException'
        '482':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
        '483':
          description: InvalidApplicationConfigurationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidApplicationConfigurationException'
        '484':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartApplicationRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - KinesisAnalytics_20180523.StartApplication
      tags:
      - '#X Amz Target=KinesisAnalytics 20180523.StartApplication'
components:
  schemas:
    InputStartingPositionConfiguration:
      type: object
      properties:
        InputStartingPosition:
          allOf:
          - $ref: '#/components/schemas/InputStartingPosition'
          - description: <p>The starting position on the stream.</p> <ul> <li> <p> <code>NOW</code> - Start reading just after the most recent record in the stream, and start at the request timestamp that the customer issued.</p> </li> <li> <p> <code>TRIM_HORIZON</code> - Start reading at the last untrimmed record in the stream, which is the oldest record available in the stream. This option is not available for an Amazon Kinesis Data Firehose delivery stream.</p> </li> <li> <p> <code>LAST_STOPPED_POINT</code> - Resume reading from where the application last stopped reading.</p> </li> </ul>
      description: Describes the point at which the application reads from the streaming source.
    ResourceNotFoundException: {}
    SqlRunConfigurations:
      type: array
      items:
        $ref: '#/components/schemas/SqlRunConfiguration'
    InvalidRequestException: {}
    ResourceInUseException: {}
    InvalidArgumentException: {}
    ApplicationName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
    SqlRunConfiguration:
      type: object
      required:
      - InputId
      - InputStartingPositionConfiguration
      properties:
        InputId:
          allOf:
          - $ref: '#/components/schemas/Id'
          - description: 'The input source ID. You can get this ID by calling the <a>DescribeApplication</a> operation. '
        InputStartingPositionConfiguration:
          allOf:
          - $ref: '#/components/schemas/InputStartingPositionConfiguration'
          - description: 'The point at which you want the application to start processing records from the streaming source. '
      description: Describes the starting parameters for a SQL-based Kinesis Data Analytics application.
    RunConfiguration:
      type: object
      properties:
        FlinkRunConfiguration:
          allOf:
          - $ref: '#/components/schemas/FlinkRunConfiguration'
          - description: Describes the starting parameters for a Flink-based Kinesis Data Analytics application.
        SqlRunConfigurations:
          allOf:
          - $ref: '#/components/schemas/SqlRunConfigurations'
          - description: Describes the starting parameters for a SQL-based Kinesis Data Analytics application application.
        ApplicationRestoreConfiguration:
          allOf:
          - $ref: '#/components/schemas/ApplicationRestoreConfiguration'
          - description: Describes the restore behavior of a restarting application.
      description: Describes the starting parameters for an Kinesis Data Analytics application.
    Id:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 50
    StartApplicationResponse:
      type: object
      properties: {}
    InputStartingPosition:
      type: string
      enum:
      - NOW
      - TRIM_HORIZON
      - LAST_STOPPED_POINT
    SnapshotName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 256
    ApplicationRestoreConfiguration:
      type: object
      required:
      - ApplicationRestoreType
      properties:
        ApplicationRestoreType:
          allOf:
          - $ref: '#/components/schemas/ApplicationRestoreType'
          - description: Specifies how the application should be restored.
        SnapshotName:
          allOf:
          - $ref: '#/components/schemas/SnapshotName'
          - description: The identifier of an existing snapshot of application state to use to restart an application. The application uses this value if <code>RESTORE_FROM_CUSTOM_SNAPSHOT</code> is specified for the <code>ApplicationRestoreType</code>.
      description: Specifies the method and snapshot to use when restarting an application using previously saved application state.
    InvalidApplicationConfigurationException: {}
    FlinkRunConfiguration:
      type: object
      properties:
        AllowNonRestoredState:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: <p>When restoring from a snapshot, specifies whether the runtime is allowed to skip a state that cannot be mapped to the new program. This will happen if the program is updated between snapshots to remove stateful parameters, and state data in the snapshot no longer corresponds to valid application data. For more information, see <a href="https://ci.apache.org/projects/flink/flink-docs-release-1.8/ops/state/savepoints.html#allowing-non-restored-state"> Allowing Non-Restored State</a> in the <a href="https://ci.apache.org/projects/flink/flink-docs-release-1.8/">Apache Flink documentation</a>.</p> <note> <p>This value defaults to <code>false</code>. If you update your application without specifying this parameter, <code>AllowNonRestoredState</code> will be set to <code>false</code>, even if it was previously set to <code>true</code>.</p> </note>
      description: Describes the starting parameters for a Flink-based Kinesis Data Analytics application.
    ApplicationRestoreType:
      type: string
      enum:
      - SKIP_RESTORE_FROM_SNAPSHOT
      - RESTORE_FROM_LATEST_SNAPSHOT
      - RESTORE_FROM_CUSTOM_SNAPSHOT
    StartApplicationRequest:
      type: object
      required:
      - ApplicationName
      title: StartApplicationRequest
      properties:
        ApplicationName:
          allOf:
          - $ref: '#/components/schemas/ApplicationName'
          - description: The name of the application.
        RunConfiguration:
          allOf:
          - $ref: '#/components/schemas/RunConfiguration'
          - description: Identifies the run configuration (start parameters) of a Kinesis Data Analytics application.
    BooleanObject:
      type: boolean
  parameters:
    X-Amz-Security-Token:
