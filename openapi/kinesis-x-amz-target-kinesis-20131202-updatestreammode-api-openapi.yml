    post:
      operationId: UpdateStreamMode
      description: ' Updates the capacity mode of the data stream. Currently, in Kinesis Data Streams, you can choose between an <b>on-demand</b> capacity mode and a <b>provisioned</b> capacity mode for your data stream. '
      responses:
        '200':
          description: Success
        '480':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
        '481':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '482':
          description: ResourceInUseException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInUseException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStreamModeInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - Kinesis_20131202.UpdateStreamMode
      tags:
      - '#X Amz Target=Kinesis 20131202.UpdateStreamMode'
components:
  schemas:
    StreamMode:
      type: string
      enum:
      - PROVISIONED
      - ON_DEMAND
    ResourceNotFoundException: {}
    ResourceInUseException: {}
    StreamARN:
      type: string
      pattern: arn:aws.*:kinesis:.*:\d{12}:stream/\S+
      minLength: 1
      maxLength: 2048
    InvalidArgumentException: {}
    UpdateStreamModeInput:
      type: object
      required:
      - StreamARN
      - StreamModeDetails
      title: UpdateStreamModeInput
      properties:
        StreamARN:
          allOf:
          - $ref: '#/components/schemas/StreamARN'
          - description: ' Specifies the ARN of the data stream whose capacity mode you want to update. '
        StreamModeDetails:
          allOf:
          - $ref: '#/components/schemas/StreamModeDetails'
          - description: ' Specifies the capacity mode to which you want to set your data stream. Currently, in Kinesis Data Streams, you can choose between an <b>on-demand</b> capacity mode and a <b>provisioned</b> capacity mode for your data streams. '
    StreamModeDetails:
      type: object
      required:
      - StreamMode
      properties:
        StreamMode:
          allOf:
          - $ref: '#/components/schemas/StreamMode'
          - description: ' Specifies the capacity mode to which you want to set your data stream. Currently, in Kinesis Data Streams, you can choose between an <b>on-demand</b> capacity mode and a <b>provisioned</b> capacity mode for your data streams. '
      description: ' Specifies the capacity mode to which you want to set your data stream. Currently, in Kinesis Data Streams, you can choose between an <b>on-demand</b> capacity mode and a <b>provisioned</b> capacity mode for your data streams. '
    LimitExceededException: {}
