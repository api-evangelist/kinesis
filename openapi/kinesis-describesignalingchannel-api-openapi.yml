security:
- hmac: []
tags:
- name: DescribeSignalingChannel
paths:
  /describeSignalingChannel:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeSignalingChannel
      description: Returns the most current information about the signaling channel. You must specify either the name or the Amazon Resource Name (ARN) of the channel that you want to describe.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeSignalingChannelOutput'
        '480':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
        '481':
          description: ClientLimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLimitExceededException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ChannelName:
                  description: The name of the signaling channel that you want to describe.
                  type: string
                  pattern: '[a-zA-Z0-9_.-]+'
                  minLength: 1
                  maxLength: 256
                ChannelARN:
                  description: The ARN of the signaling channel that you want to describe.
                  type: string
                  pattern: arn:[a-z\d-]+:kinesisvideo:[a-z0-9-]+:[0-9]+:[a-z]+/[a-zA-Z0-9_.-]+/[0-9]+
                  minLength: 1
                  maxLength: 1024
      tags:
      - DescribeSignalingChannel
components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    SingleMasterConfiguration:
      type: object
      properties:
        MessageTtlSeconds:
          allOf:
          - $ref: '#/components/schemas/MessageTtlSeconds'
          - description: The period of time a signaling channel retains undelivered messages before they are discarded.
      description: A structure that contains the configuration for the <code>SINGLE_MASTER</code> channel type.
    ResourceARN:
      type: string
      pattern: arn:[a-z\d-]+:kinesisvideo:[a-z0-9-]+:[0-9]+:[a-z]+/[a-zA-Z0-9_.-]+/[0-9]+
      minLength: 1
      maxLength: 1024
    AccessDeniedException: {}
    InvalidArgumentException: {}
    ChannelInfo:
      type: object
      properties:
        ChannelName:
          allOf:
          - $ref: '#/components/schemas/ChannelName'
          - description: The name of the signaling channel.
        ChannelARN:
          allOf:
          - $ref: '#/components/schemas/ResourceARN'
          - description: The Amazon Resource Name (ARN) of the signaling channel.
        ChannelType:
          allOf:
          - $ref: '#/components/schemas/ChannelType'
          - description: The type of the signaling channel.
        ChannelStatus:
          allOf:
          - $ref: '#/components/schemas/Status'
          - description: Current status of the signaling channel.
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time at which the signaling channel was created.
        SingleMasterConfiguration:
          allOf:
          - $ref: '#/components/schemas/SingleMasterConfiguration'
          - description: A structure that contains the configuration for the <code>SINGLE_MASTER</code> channel type.
        Version:
          allOf:
          - $ref: '#/components/schemas/Version'
          - description: The current version of the signaling channel.
      description: A structure that encapsulates a signaling channel's metadata and properties.
    ResourceNotFoundException: {}
    ChannelType:
      type: string
      enum:
      - SINGLE_MASTER
      - FULL_MESH
    ChannelName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 256
    Version:
      type: string
      pattern: '[a-zA-Z0-9]+'
      minLength: 1
      maxLength: 64
    ClientLimitExceededException: {}
    Timestamp:
      type: string
      format: date-time
    DescribeSignalingChannelOutput:
      type: object
      properties:
        ChannelInfo:
          allOf:
          - $ref: '#/components/schemas/ChannelInfo'
          - description: A structure that encapsulates the specified signaling channel's metadata and properties.
    MessageTtlSeconds:
      type: integer
      minimum: 5
      maximum: 120
    Status:
      type: string
      enum:
      - CREATING
      - ACTIVE
      - UPDATING
      - DELETING
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/firehose/
x-hasEquivalentPaths: true
