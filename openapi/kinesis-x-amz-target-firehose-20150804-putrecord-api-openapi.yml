        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
  schemas:
    BooleanObject:
      type: boolean
    Record:
      type: object
      required:
      - Data
      properties:
        Data:
          allOf:
          - $ref: '#/components/schemas/Data'
          - description: The data blob, which is base64-encoded when the blob is serialized. The maximum size of the data blob, before base64-encoding, is 1,000 KiB.
      description: The unit of data in a delivery stream.
    PutResponseRecordId:
      type: string
      minLength: 1
    ResourceNotFoundException: {}
    ServiceUnavailableException: {}
    InvalidKMSResourceException: {}
    DeliveryStreamName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 64
    PutRecordOutput:
      type: object
      required:
      - RecordId
      properties:
        RecordId:
          allOf:
          - $ref: '#/components/schemas/PutResponseRecordId'
          - description: The ID of the record.
        Encrypted:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Indicates whether server-side encryption (SSE) was enabled during this operation.
    InvalidArgumentException: {}
    PutRecordInput:
      type: object
      required:
      - DeliveryStreamName
      - Record
      title: PutRecordInput
      properties:
        DeliveryStreamName:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamName'
          - description: The name of the delivery stream.
        Record:
          allOf:
          - $ref: '#/components/schemas/Record'
          - description: The record.
    Data:
      type: string
      minLength: 0
      maxLength: 1024000
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
