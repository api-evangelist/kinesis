components:
  schemas:
    CloudWatchLoggingOptionDescriptions:
      type: array
      items:
        $ref: '#/components/schemas/CloudWatchLoggingOptionDescription'
    ResourceNotFoundException: {}
    AddApplicationCloudWatchLoggingOptionRequest:
      type: object
      required:
      - ApplicationName
      - CloudWatchLoggingOption
      title: AddApplicationCloudWatchLoggingOptionRequest
      properties:
        ApplicationName:
          allOf:
          - $ref: '#/components/schemas/ApplicationName'
          - description: The Kinesis Data Analytics application name.
        CurrentApplicationVersionId:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionId'
          - description: The version ID of the Kinesis Data Analytics application. You must provide the <code>CurrentApplicationVersionId</code> or the <code>ConditionalToken</code>.You can retrieve the application version ID using <a>DescribeApplication</a>. For better concurrency support, use the <code>ConditionalToken</code> parameter instead of <code>CurrentApplicationVersionId</code>.
        CloudWatchLoggingOption:
          allOf:
          - $ref: '#/components/schemas/CloudWatchLoggingOption'
          - description: 'Provides the Amazon CloudWatch log stream Amazon Resource Name (ARN). '
        ConditionalToken:
          allOf:
          - $ref: '#/components/schemas/ConditionalToken'
          - description: A value you use to implement strong concurrency for application updates. You must provide the <code>CurrentApplicationVersionId</code> or the <code>ConditionalToken</code>. You get the application's current <code>ConditionalToken</code> using <a>DescribeApplication</a>. For better concurrency support, use the <code>ConditionalToken</code> parameter instead of <code>CurrentApplicationVersionId</code>.
    ConcurrentModificationException: {}
    InvalidRequestException: {}
    CloudWatchLoggingOptionDescription:
      type: object
      required:
      - LogStreamARN
      properties:
        CloudWatchLoggingOptionId:
          allOf:
          - $ref: '#/components/schemas/Id'
          - description: The ID of the CloudWatch logging option description.
        LogStreamARN:
          allOf:
          - $ref: '#/components/schemas/LogStreamARN'
          - description: The Amazon Resource Name (ARN) of the CloudWatch log to receive application messages.
        RoleARN:
          allOf:
          - $ref: '#/components/schemas/RoleARN'
          - description: <p>The IAM ARN of the role to use to send application messages. </p> <note> <p>Provided for backward compatibility. Applications created with the current API version have an application-level service execution role rather than a resource-level role.</p> </note>
      description: Describes the Amazon CloudWatch logging option.
    ResourceInUseException: {}
    ResourceARN:
      type: string
      pattern: arn:.*
      minLength: 1
      maxLength: 2048
    InvalidArgumentException: {}
    ApplicationName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
    AddApplicationCloudWatchLoggingOptionResponse:
      type: object
      properties:
        ApplicationARN:
          allOf:
          - $ref: '#/components/schemas/ResourceARN'
          - description: The application's ARN.
        ApplicationVersionId:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionId'
          - description: 'The new version ID of the Kinesis Data Analytics application. Kinesis Data Analytics updates the <code>ApplicationVersionId</code> each time you change the CloudWatch logging options. '
        CloudWatchLoggingOptionDescriptions:
          allOf:
          - $ref: '#/components/schemas/CloudWatchLoggingOptionDescriptions'
          - description: The descriptions of the current CloudWatch logging options for the Kinesis Data Analytics application.
    RoleARN:
      type: string
      pattern: arn:.*
      minLength: 1
      maxLength: 2048
    LogStreamARN:
      type: string
      pattern: arn:.*
      minLength: 1
      maxLength: 2048
    InvalidApplicationConfigurationException: {}
    ConditionalToken:
      type: string
      pattern: '[a-zA-Z0-9-_+/=]+'
      minLength: 1
      maxLength: 512
    ApplicationVersionId:
      type: integer
      minimum: 1
      maximum: 999999999
    CloudWatchLoggingOption:
      type: object
      required:
      - LogStreamARN
      properties:
        LogStreamARN:
          allOf:
          - $ref: '#/components/schemas/LogStreamARN'
          - description: The ARN of the CloudWatch log to receive application messages.
      description: 'Provides a description of Amazon CloudWatch logging options, including the log stream Amazon Resource Name (ARN). '
    Id:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 50
