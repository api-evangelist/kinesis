components:
  schemas:
    KMSOptInRequired: {}
    ResourceNotFoundException: {}
    ShardId:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
    ShardIterator:
      type: string
      minLength: 1
      maxLength: 512
    Data:
      type: string
      minLength: 0
      maxLength: 1048576
    ChildShard:
      type: object
      required:
      - ShardId
      - ParentShards
      - HashKeyRange
      properties:
        ShardId:
          allOf:
          - $ref: '#/components/schemas/ShardId'
          - description: The shard ID of the existing child shard of the current shard.
        ParentShards:
          allOf:
          - $ref: '#/components/schemas/ShardIdList'
          - description: The current shard that is the parent of the existing child shard.
        HashKeyRange:
          $ref: '#/components/schemas/HashKeyRange'
      description: Output parameter of the GetRecords API. The existing child shard of the current shard.
    ChildShardList:
      type: array
      items:
        $ref: '#/components/schemas/ChildShard'
    ShardIdList:
      type: array
      items:
        $ref: '#/components/schemas/ShardId'
    ProvisionedThroughputExceededException: {}
    AccessDeniedException: {}
    RecordList:
      type: array
      items:
        $ref: '#/components/schemas/Record'
    InvalidArgumentException: {}
    PartitionKey:
      type: string
      minLength: 1
      maxLength: 256
    KMSNotFoundException: {}
    Timestamp:
      type: string
      format: date-time
    KMSDisabledException: {}
    HashKeyRange:
      type: object
      required:
      - StartingHashKey
      - EndingHashKey
      properties:
        StartingHashKey:
          allOf:
          - $ref: '#/components/schemas/HashKey'
          - description: The starting hash key of the hash key range.
        EndingHashKey:
          allOf:
          - $ref: '#/components/schemas/HashKey'
          - description: The ending hash key of the hash key range.
      description: The range of possible hash key values for the shard, which is a set of ordered contiguous positive integers.
    Record:
      type: object
      required:
      - SequenceNumber
      - Data
      - PartitionKey
      properties:
        SequenceNumber:
          allOf:
          - $ref: '#/components/schemas/SequenceNumber'
          - description: The unique identifier of the record within its shard.
        ApproximateArrivalTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The approximate time that the record was inserted into the stream.
        Data:
          allOf:
          - $ref: '#/components/schemas/Data'
          - description: The data blob. The data in the blob is both opaque and immutable to Kinesis Data Streams, which does not inspect, interpret, or change the data in the blob in any way. When the data blob (the payload before base64-encoding) is added to the partition key size, the total size must not exceed the maximum record size (1 MiB).
        PartitionKey:
          allOf:
          - $ref: '#/components/schemas/PartitionKey'
          - description: Identifies which shard in the stream the data record is assigned to.
        EncryptionType:
          allOf:
          - $ref: '#/components/schemas/EncryptionType'
          - description: '<p>The encryption type used on the record. This parameter can be one of the following values:</p> <ul> <li> <p> <code>NONE</code>: Do not encrypt the records in the stream.</p> </li> <li> <p> <code>KMS</code>: Use server-side encryption on the records in the stream using a customer-managed Amazon Web Services KMS key.</p> </li> </ul>'
      description: The unit of data of the Kinesis data stream, which is composed of a sequence number, a partition key, and a data blob.
    GetRecordsInput:
      type: object
      required:
      - ShardIterator
      title: GetRecordsInput
      properties:
        ShardIterator:
          allOf:
          - $ref: '#/components/schemas/ShardIterator'
          - description: The position in the shard from which you want to start sequentially reading data records. A shard iterator specifies this position using the sequence number of a data record in the shard.
        Limit:
          allOf:
          - $ref: '#/components/schemas/GetRecordsInputLimit'
          - description: The maximum number of records to return. Specify a value of up to 10,000. If you specify a value that is greater than 10,000, <a>GetRecords</a> throws <code>InvalidArgumentException</code>. The default value is 10,000.
        StreamARN:
          allOf:
          - $ref: '#/components/schemas/StreamARN'
          - description: The ARN of the stream.
      description: Represents the input for <a>GetRecords</a>.
    GetRecordsInputLimit:
      type: integer
      minimum: 1
      maximum: 10000
    KMSInvalidStateException: {}
    EncryptionType:
      type: string
      enum:
      - NONE
      - KMS
    ExpiredIteratorException: {}
    MillisBehindLatest:
      type: integer
      minimum: 0
    GetRecordsOutput:
      type: object
      required:
      - Records
      properties:
        Records:
          allOf:
          - $ref: '#/components/schemas/RecordList'
          - description: The data records retrieved from the shard.
        NextShardIterator:
          allOf:
          - $ref: '#/components/schemas/ShardIterator'
          - description: 'The next position in the shard from which to start sequentially reading data records. If set to <code>null</code>, the shard has been closed and the requested iterator does not return any more data. '
        MillisBehindLatest:
          allOf:
          - $ref: '#/components/schemas/MillisBehindLatest'
          - description: The number of milliseconds the <a>GetRecords</a> response is from the tip of the stream, indicating how far behind current time the consumer is. A value of zero indicates that record processing is caught up, and there are no new records to process at this moment.
        ChildShards:
          allOf:
          - $ref: '#/components/schemas/ChildShardList'
          - description: The list of the current shard's child shards, returned in the <code>GetRecords</code> API's response only when the end of the current shard is reached.
      description: Represents the output for <a>GetRecords</a>.
    KMSAccessDeniedException: {}
    StreamARN:
      type: string
      pattern: arn:aws.*:kinesis:.*:\d{12}:stream/\S+
      minLength: 1
      maxLength: 2048
    SequenceNumber:
      type: string
      pattern: 0|([1-9]\d{0,128})
    KMSThrottlingException: {}
    HashKey:
      type: string
      pattern: 0|([1-9]\d{0,38})
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
