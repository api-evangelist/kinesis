          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyTagsException'
        '483':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
        '484':
