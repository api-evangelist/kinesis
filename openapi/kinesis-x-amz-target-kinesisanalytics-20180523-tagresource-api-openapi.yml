components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    TagKey:
      type: string
      minLength: 1
      maxLength: 128
    Tag:
      type: object
      required:
      - Key
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key of the key-value tag.
        Value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value of the key-value tag. The value is optional.
      description: A key-value pair (the value is optional) that you can define and assign to Amazon resources. If you specify a tag that already exists, the tag value is replaced with the value that you specify in the request. Note that the maximum number of application tags includes system tags. The maximum number of user-defined application tags is 50. For more information, see <a href="https://docs.aws.amazon.com/kinesisanalytics/latest/java/how-tagging.html">Using Tagging</a>.
    TagResourceRequest:
      type: object
      required:
      - ResourceARN
      - Tags
      title: TagResourceRequest
      properties:
        ResourceARN:
          allOf:
          - $ref: '#/components/schemas/KinesisAnalyticsARN'
          - description: The ARN of the application to assign the tags.
        Tags:
          allOf:
          - $ref: '#/components/schemas/Tags'
          - description: The key-value tags to assign to the application.
    KinesisAnalyticsARN:
      type: string
      pattern: arn:.*
      minLength: 1
      maxLength: 2048
    ConcurrentModificationException: {}
    InvalidArgumentException: {}
    ResourceNotFoundException: {}
    ResourceInUseException: {}
    Tags:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
      minItems: 1
      maxItems: 200
    TooManyTagsException: {}
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    TagResourceResponse:
      type: object
      properties: {}
