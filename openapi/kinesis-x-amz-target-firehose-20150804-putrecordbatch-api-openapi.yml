  schemas:
    PutRecordBatchResponseEntry:
      type: object
      properties:
        RecordId:
          allOf:
          - $ref: '#/components/schemas/PutResponseRecordId'
          - description: The ID of the record.
        ErrorCode:
          allOf:
          - $ref: '#/components/schemas/ErrorCode'
          - description: The error code for an individual record result.
        ErrorMessage:
          allOf:
          - $ref: '#/components/schemas/ErrorMessage'
          - description: The error message for an individual record result.
      description: Contains the result for an individual record from a <a>PutRecordBatch</a> request. If the record is successfully added to your delivery stream, it receives a record ID. If the record fails to be added to your delivery stream, the result includes an error code and an error message.
    InvalidKMSResourceException: {}
    PutRecordBatchRequestEntryList:
      type: array
      items:
        $ref: '#/components/schemas/Record'
      minItems: 1
      maxItems: 500
    PutRecordBatchResponseEntryList:
      type: array
      items:
        $ref: '#/components/schemas/PutRecordBatchResponseEntry'
      minItems: 1
      maxItems: 500
    NonNegativeIntegerObject:
      type: integer
      minimum: 0
    InvalidArgumentException: {}
    PutRecordBatchInput:
      type: object
      required:
      - DeliveryStreamName
      - Records
      title: PutRecordBatchInput
      properties:
        DeliveryStreamName:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamName'
          - description: The name of the delivery stream.
        Records:
          allOf:
          - $ref: '#/components/schemas/PutRecordBatchRequestEntryList'
          - description: One or more records.
    BooleanObject:
      type: boolean
    Record:
      type: object
      required:
      - Data
      properties:
        Data:
          allOf:
          - $ref: '#/components/schemas/Data'
          - description: The data blob, which is base64-encoded when the blob is serialized. The maximum size of the data blob, before base64-encoding, is 1,000 KiB.
      description: The unit of data in a delivery stream.
    ResourceNotFoundException: {}
    Data:
      type: string
      minLength: 0
      maxLength: 1024000
    PutResponseRecordId:
      type: string
      minLength: 1
    ServiceUnavailableException: {}
    ErrorMessage:
      type: string
    DeliveryStreamName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 64
    PutRecordBatchOutput:
      type: object
      required:
      - FailedPutCount
      - RequestResponses
      properties:
        FailedPutCount:
          allOf:
          - $ref: '#/components/schemas/NonNegativeIntegerObject'
          - description: The number of records that might have failed processing. This number might be greater than 0 even if the <a>PutRecordBatch</a> call succeeds. Check <code>FailedPutCount</code> to determine whether there are records that you need to resend.
        Encrypted:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Indicates whether server-side encryption (SSE) was enabled during this operation.
        RequestResponses:
          allOf:
          - $ref: '#/components/schemas/PutRecordBatchResponseEntryList'
          - description: The results array. For each record, the index of the response element is the same as the index used in the request array.
    ErrorCode:
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
