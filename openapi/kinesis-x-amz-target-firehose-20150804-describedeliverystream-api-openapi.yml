          - description: The endpoint to use when communicating with the collection in the Serverless offering for Amazon OpenSearch Service.
        IndexName:
          allOf:
          - $ref: '#/components/schemas/AmazonOpenSearchServerlessIndexName'
          - description: The Serverless offering for Amazon OpenSearch Service index name.
        BufferingHints:
          allOf:
          - $ref: '#/components/schemas/AmazonOpenSearchServerlessBufferingHints'
          - description: The buffering options.
        RetryOptions:
          allOf:
          - $ref: '#/components/schemas/AmazonOpenSearchServerlessRetryOptions'
          - description: The Serverless offering for Amazon OpenSearch Service retry options.
        S3BackupMode:
          allOf:
          - $ref: '#/components/schemas/AmazonOpenSearchServerlessS3BackupMode'
          - description: The Amazon S3 backup mode.
        S3DestinationDescription:
          $ref: '#/components/schemas/S3DestinationDescription'
        ProcessingConfiguration:
          $ref: '#/components/schemas/ProcessingConfiguration'
        CloudWatchLoggingOptions:
          $ref: '#/components/schemas/CloudWatchLoggingOptions'
        VpcConfigurationDescription:
          $ref: '#/components/schemas/VpcConfigurationDescription'
      description: The destination description in the Serverless offering for Amazon OpenSearch Service.
    DeliveryStreamDescription:
      type: object
      required:
      - DeliveryStreamName
      - DeliveryStreamARN
      - DeliveryStreamStatus
      - DeliveryStreamType
      - VersionId
      - Destinations
      - HasMoreDestinations
      properties:
        DeliveryStreamName:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamName'
          - description: The name of the delivery stream.
        DeliveryStreamARN:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamARN'
          - description: The Amazon Resource Name (ARN) of the delivery stream. For more information, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html">Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces</a>.
        DeliveryStreamStatus:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamStatus'
          - description: The status of the delivery stream. If the status of a delivery stream is <code>CREATING_FAILED</code>, this status doesn't change, and you can't invoke <code>CreateDeliveryStream</code> again on it. However, you can invoke the <a>DeleteDeliveryStream</a> operation to delete it.
        FailureDescription:
          allOf:
          - $ref: '#/components/schemas/FailureDescription'
          - description: 'Provides details in case one of the following operations fails due to an error related to KMS: <a>CreateDeliveryStream</a>, <a>DeleteDeliveryStream</a>, <a>StartDeliveryStreamEncryption</a>, <a>StopDeliveryStreamEncryption</a>.'
        DeliveryStreamEncryptionConfiguration:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamEncryptionConfiguration'
          - description: Indicates the server-side encryption (SSE) status for the delivery stream.
        DeliveryStreamType:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamType'
          - description: '<p>The delivery stream type. This can be one of the following values:</p> <ul> <li> <p> <code>DirectPut</code>: Provider applications access the delivery stream directly.</p> </li> <li> <p> <code>KinesisStreamAsSource</code>: The delivery stream uses a Kinesis data stream as a source.</p> </li> </ul>'
        VersionId:
          allOf:
          - $ref: '#/components/schemas/DeliveryStreamVersionId'
          - description: Each time the destination is updated for a delivery stream, the version ID is changed, and the current version ID is required when updating the destination. This is so that the service knows it is applying the changes to the correct version of the delivery stream.
        CreateTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date and time that the delivery stream was created.
        LastUpdateTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date and time that the delivery stream was last updated.
        Source:
          allOf:
          - $ref: '#/components/schemas/SourceDescription'
          - description: If the <code>DeliveryStreamType</code> parameter is <code>KinesisStreamAsSource</code>, a <a>SourceDescription</a> object describing the source Kinesis data stream.
        Destinations:
          allOf:
          - $ref: '#/components/schemas/DestinationDescriptionList'
          - description: The destinations.
        HasMoreDestinations:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Indicates whether there are more destinations available to list.
      description: Contains information about a delivery stream.
    SplunkDestinationDescription:
      type: object
      properties:
        HECEndpoint:
          allOf:
          - $ref: '#/components/schemas/HECEndpoint'
          - description: The HTTP Event Collector (HEC) endpoint to which Kinesis Data Firehose sends your data.
        HECEndpointType:
          allOf:
          - $ref: '#/components/schemas/HECEndpointType'
          - description: This type can be either "Raw" or "Event."
        HECToken:
          allOf:
          - $ref: '#/components/schemas/HECToken'
          - description: A GUID you obtain from your Splunk cluster when you create a new HEC endpoint.
        HECAcknowledgmentTimeoutInSeconds:
          allOf:
          - $ref: '#/components/schemas/HECAcknowledgmentTimeoutInSeconds'
          - description: The amount of time that Kinesis Data Firehose waits to receive an acknowledgment from Splunk after it sends it data. At the end of the timeout period, Kinesis Data Firehose either tries to send the data again or considers it an error, based on your retry settings.
        RetryOptions:
          allOf:
          - $ref: '#/components/schemas/SplunkRetryOptions'
          - description: The retry behavior in case Kinesis Data Firehose is unable to deliver data to Splunk or if it doesn't receive an acknowledgment of receipt from Splunk.
        S3BackupMode:
          allOf:
          - $ref: '#/components/schemas/SplunkS3BackupMode'
          - description: 'Defines how documents should be delivered to Amazon S3. When set to <code>FailedDocumentsOnly</code>, Kinesis Data Firehose writes any data that could not be indexed to the configured Amazon S3 destination. When set to <code>AllDocuments</code>, Kinesis Data Firehose delivers all incoming records to Amazon S3, and also writes failed documents to Amazon S3. Default value is <code>FailedDocumentsOnly</code>. '
        S3DestinationDescription:
          allOf:
          - $ref: '#/components/schemas/S3DestinationDescription'
          - description: The Amazon S3 destination.&gt;
        ProcessingConfiguration:
          allOf:
          - $ref: '#/components/schemas/ProcessingConfiguration'
          - description: The data processing configuration.
        CloudWatchLoggingOptions:
          allOf:
          - $ref: '#/components/schemas/CloudWatchLoggingOptions'
          - description: The Amazon CloudWatch logging options for your delivery stream.
      description: Describes a destination in Splunk.
    HttpEndpointRequestConfiguration:
      type: object
      properties:
        ContentEncoding:
          allOf:
          - $ref: '#/components/schemas/ContentEncoding'
          - description: Kinesis Data Firehose uses the content encoding to compress the body of a request before sending the request to the destination. For more information, see <a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Encoding">Content-Encoding</a> in MDN Web Docs, the official Mozilla documentation.
        CommonAttributes:
          allOf:
          - $ref: '#/components/schemas/HttpEndpointCommonAttributesList'
          - description: Describes the metadata sent to the HTTP endpoint destination.
      description: The configuration of the HTTP endpoint request.
    Timestamp:
      type: string
      format: date-time
    SizeInMBs:
      type: integer
      minimum: 1
      maximum: 128
    HttpEndpointBufferingSizeInMBs:
      type: integer
      minimum: 1
      maximum: 64
    ClusterJDBCURL:
      type: string
      pattern: jdbc:(redshift|postgresql)://((?!-)[A-Za-z0-9-]{1,63}(?<!-)\.)+redshift\.([a-zA-Z0-9\.]+):\d{1,5}/[a-zA-Z0-9_$-]+
      minLength: 1
      maxLength: 512
    NonEmptyStringWithoutWhitespace:
      type: string
      pattern: ^\S+$
      minLength: 1
      maxLength: 1024
    ElasticsearchBufferingHints:
      type: object
      properties:
        IntervalInSeconds:
          allOf:
          - $ref: '#/components/schemas/ElasticsearchBufferingIntervalInSeconds'
          - description: Buffer incoming data for the specified period of time, in seconds, before delivering it to the destination. The default value is 300 (5 minutes).
        SizeInMBs:
          allOf:
          - $ref: '#/components/schemas/ElasticsearchBufferingSizeInMBs'
          - description: <p>Buffer incoming data to the specified size, in MBs, before delivering it to the destination. The default value is 5.</p> <p>We recommend setting this parameter to a value greater than the amount of data you typically ingest into the delivery stream in 10 seconds. For example, if you typically ingest data at 1 MB/sec, the value should be 10 MB or higher.</p>
      description: Describes the buffering to perform before delivering data to the Amazon ES destination.
    RedshiftDestinationDescription:
      type: object
      required:
      - RoleARN
      - ClusterJDBCURL
      - CopyCommand
      - Username
      - S3DestinationDescription
      properties:
        RoleARN:
          allOf:
          - $ref: '#/components/schemas/RoleARN'
          - description: The Amazon Resource Name (ARN) of the Amazon Web Services credentials. For more information, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html">Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces</a>.
        ClusterJDBCURL:
          allOf:
          - $ref: '#/components/schemas/ClusterJDBCURL'
          - description: The database connection string.
        CopyCommand:
          allOf:
          - $ref: '#/components/schemas/CopyCommand'
          - description: The <code>COPY</code> command.
        Username:
          allOf:
