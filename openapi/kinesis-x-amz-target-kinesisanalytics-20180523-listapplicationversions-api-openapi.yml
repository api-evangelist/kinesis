    post:
      operationId: ListApplicationVersions
      description: <p>Lists all the versions for the specified application, including versions that were rolled back. The response also includes a summary of the configuration associated with each version.</p> <p>To get the complete description of a specific application version, invoke the <a>DescribeApplicationVersion</a> operation.</p> <note> <p>This operation is supported only for Amazon Kinesis Data Analytics for Apache Flink.</p> </note>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationVersionsResponse'
        '480':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: UnsupportedOperationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListApplicationVersionsRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - KinesisAnalytics_20180523.ListApplicationVersions
      tags:
      - '#X Amz Target=KinesisAnalytics 20180523.ListApplicationVersions'
components:
  schemas:
    ListApplicationVersionsRequest:
      type: object
      required:
      - ApplicationName
      title: ListApplicationVersionsRequest
      properties:
        ApplicationName:
          allOf:
          - $ref: '#/components/schemas/ApplicationName'
          - description: The name of the application for which you want to list all versions.
        Limit:
          allOf:
          - $ref: '#/components/schemas/ListApplicationVersionsInputLimit'
          - description: The maximum number of versions to list in this invocation of the operation.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: If a previous invocation of this operation returned a pagination token, pass it into this value to retrieve the next set of results. For more information about pagination, see <a href="https://docs.aws.amazon.com/cli/latest/userguide/pagination.html">Using the Amazon Command Line Interface's Pagination Options</a>.
    ResourceNotFoundException: {}
    ApplicationStatus:
      type: string
      enum:
      - DELETING
      - STARTING
      - STOPPING
      - READY
      - RUNNING
      - UPDATING
      - AUTOSCALING
      - FORCE_STOPPING
      - ROLLING_BACK
      - MAINTENANCE
      - ROLLED_BACK
    UnsupportedOperationException: {}
    ApplicationVersionSummary:
      type: object
      required:
      - ApplicationVersionId
      - ApplicationStatus
      properties:
        ApplicationVersionId:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionId'
          - description: The ID of the application version. Kinesis Data Analytics updates the <code>ApplicationVersionId</code> each time you update the application.
        ApplicationStatus:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatus'
          - description: The status of the application.
      description: The summary of the application version.
    NextToken:
      type: string
      minLength: 1
      maxLength: 512
    ApplicationVersionSummaries:
      type: array
      items:
        $ref: '#/components/schemas/ApplicationVersionSummary'
    InvalidArgumentException: {}
    ApplicationName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
    ListApplicationVersionsResponse:
      type: object
      properties:
        ApplicationVersionSummaries:
          allOf:
          - $ref: '#/components/schemas/ApplicationVersionSummaries'
          - description: <p>A list of the application versions and the associated configuration summaries. The list includes application versions that were rolled back.</p> <p>To get the complete description of a specific application version, invoke the <a>DescribeApplicationVersion</a> operation.</p>
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The pagination token for the next set of results, or <code>null</code> if there are no additional results. To retrieve the next set of items, pass this token into a subsequent invocation of this operation. For more information about pagination, see <a href="https://docs.aws.amazon.com/cli/latest/userguide/pagination.html">Using the Amazon Command Line Interface's Pagination Options</a>.
    ApplicationVersionId:
      type: integer
      minimum: 1
      maximum: 999999999
    ListApplicationVersionsInputLimit:
      type: integer
      minimum: 1
      maximum: 50
