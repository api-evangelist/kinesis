tags:
- name: '#X Amz Target=Kinesis 20131202.DescribeStreamConsumer'
paths:
  /#X-Amz-Target=Kinesis_20131202.DescribeStreamConsumer:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeStreamConsumer
      description: <p>To get the description of a registered consumer, provide the ARN of the consumer. Alternatively, you can provide the ARN of the data stream and the name you gave the consumer when you registered it. You may also provide all three parameters, as long as they don't conflict with each other. If you don't know the name or ARN of the consumer that you want to describe, you can use the <a>ListStreamConsumers</a> operation to get a list of the descriptions of all the consumers that are currently registered with a given data stream.</p> <p>This operation has a limit of 20 transactions per second per stream.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeStreamConsumerOutput'
        '480':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeStreamConsumerInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - Kinesis_20131202.DescribeStreamConsumer
      tags:
      - '#X Amz Target=Kinesis 20131202.DescribeStreamConsumer'
components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
  schemas:
    LimitExceededException: {}
    DescribeStreamConsumerOutput:
      type: object
      required:
      - ConsumerDescription
      properties:
        ConsumerDescription:
          allOf:
          - $ref: '#/components/schemas/ConsumerDescription'
          - description: An object that represents the details of the consumer.
    StreamARN:
      type: string
      pattern: arn:aws.*:kinesis:.*:\d{12}:stream/\S+
      minLength: 1
      maxLength: 2048
    ResourceNotFoundException: {}
    DescribeStreamConsumerInput:
      type: object
      title: DescribeStreamConsumerInput
      properties:
        StreamARN:
          allOf:
          - $ref: '#/components/schemas/StreamARN'
          - description: The ARN of the Kinesis data stream that the consumer is registered with. For more information, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html#arn-syntax-kinesis-streams">Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces</a>.
        ConsumerName:
          allOf:
          - $ref: '#/components/schemas/ConsumerName'
          - description: The name that you gave to the consumer.
        ConsumerARN:
          allOf:
          - $ref: '#/components/schemas/ConsumerARN'
          - description: The ARN returned by Kinesis Data Streams when you registered the consumer.
    ConsumerARN:
      type: string
      pattern: ^(arn):aws.*:kinesis:.*:\d{12}:.*stream\/[a-zA-Z0-9_.-]+\/consumer\/[a-zA-Z0-9_.-]+:[0-9]+
      minLength: 1
      maxLength: 2048
    ConsumerStatus:
      type: string
      enum:
      - CREATING
      - DELETING
      - ACTIVE
    ConsumerDescription:
      type: object
      required:
      - ConsumerName
      - ConsumerARN
      - ConsumerStatus
      - ConsumerCreationTimestamp
      - StreamARN
      properties:
        ConsumerName:
          allOf:
          - $ref: '#/components/schemas/ConsumerName'
          - description: The name of the consumer is something you choose when you register the consumer.
        ConsumerARN:
          allOf:
          - $ref: '#/components/schemas/ConsumerARN'
          - description: <p>When you register a consumer, Kinesis Data Streams generates an ARN for it. You need this ARN to be able to call <a>SubscribeToShard</a>.</p> <p>If you delete a consumer and then create a new one with the same name, it won't have the same ARN. That's because consumer ARNs contain the creation timestamp. This is important to keep in mind if you have IAM policies that reference consumer ARNs.</p>
        ConsumerStatus:
          allOf:
          - $ref: '#/components/schemas/ConsumerStatus'
          - description: A consumer can't read data while in the <code>CREATING</code> or <code>DELETING</code> states.
        ConsumerCreationTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: <p/>
        StreamARN:
          allOf:
          - $ref: '#/components/schemas/StreamARN'
          - description: The ARN of the stream with which you registered the consumer.
      description: An object that represents the details of a registered consumer. This type of object is returned by <a>DescribeStreamConsumer</a>.
    Timestamp:
      type: string
      format: date-time
    ConsumerName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
    InvalidArgumentException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
