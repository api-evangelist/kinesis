- name: '#X Amz Target=KinesisAnalytics 20180523.CreateApplicationPresignedUrl'
paths:
  /#X-Amz-Target=KinesisAnalytics_20180523.CreateApplicationPresignedUrl:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateApplicationPresignedUrl
      description: <p>Creates and returns a URL that you can use to connect to an application's extension.</p> <p>The IAM role or user used to call this API defines the permissions to access the extension. After the presigned URL is created, no additional permission is required to access this URL. IAM authorization policies for this API are also enforced for every HTTP request that attempts to connect to the extension. </p> <p>You control the amount of time that the URL will be valid using the <code>SessionExpirationDurationInSeconds</code> parameter. If you do not provide this parameter, the returned URL is valid for twelve hours.</p> <note> <p>The URL that you get from a call to CreateApplicationPresignedUrl must be used within 3 minutes to be valid. If you first try to use the URL after the 3-minute limit expires, the service returns an HTTP 403 Forbidden error.</p> </note>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationPresignedUrlResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: ResourceInUseException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInUseException'
        '482':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationPresignedUrlRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - KinesisAnalytics_20180523.CreateApplicationPresignedUrl
      tags:
      - '#X Amz Target=KinesisAnalytics 20180523.CreateApplicationPresignedUrl'
components:
  schemas:
    AuthorizedUrl:
      type: string
      minLength: 1
      maxLength: 2048
    CreateApplicationPresignedUrlRequest:
      type: object
      required:
      - ApplicationName
      - UrlType
      title: CreateApplicationPresignedUrlRequest
      properties:
        ApplicationName:
          allOf:
          - $ref: '#/components/schemas/ApplicationName'
          - description: The name of the application.
        UrlType:
          allOf:
          - $ref: '#/components/schemas/UrlType'
          - description: 'The type of the extension for which to create and return a URL. Currently, the only valid extension URL type is <code>FLINK_DASHBOARD_URL</code>. '
        SessionExpirationDurationInSeconds:
          allOf:
          - $ref: '#/components/schemas/SessionExpirationDurationInSeconds'
          - description: The duration in seconds for which the returned URL will be valid.
    SessionExpirationDurationInSeconds:
      type: integer
      minimum: 1800
      maximum: 43200
    ResourceNotFoundException: {}
    CreateApplicationPresignedUrlResponse:
      type: object
      properties:
        AuthorizedUrl:
          allOf:
          - $ref: '#/components/schemas/AuthorizedUrl'
          - description: The URL of the extension.
    ResourceInUseException: {}
    UrlType:
      type: string
      enum:
      - FLINK_DASHBOARD_URL
      - ZEPPELIN_UI_URL
    InvalidArgumentException: {}
    ApplicationName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
