    AccessDeniedException: {}
    InvalidArgumentException: {}
    ScalingType:
      type: string
      enum:
      - UNIFORM_SCALING
    LimitExceededException: {}
    StreamARN:
      type: string
      pattern: arn:aws.*:kinesis:.*:\d{12}:stream/\S+
      minLength: 1
      maxLength: 2048
    ResourceNotFoundException: {}
    ResourceInUseException: {}
    StreamName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
    UpdateShardCountInput:
      type: object
      required:
      - TargetShardCount
      - ScalingType
      title: UpdateShardCountInput
      properties:
        StreamName:
          allOf:
          - $ref: '#/components/schemas/StreamName'
          - description: The name of the stream.
        TargetShardCount:
          allOf:
          - $ref: '#/components/schemas/PositiveIntegerObject'
          - description: '<p>The new number of shards. This value has the following default limits. By default, you cannot do the following: </p> <ul> <li> <p>Set this value to more than double your current shard count for a stream.</p> </li> <li> <p>Set this value below half your current shard count for a stream.</p> </li> <li> <p>Set this value to more than 10000 shards in a stream (the default limit for shard count per stream is 10000 per account per region), unless you request a limit increase.</p> </li> <li> <p>Scale a stream with more than 10000 shards down unless you set this value to less than 10000 shards.</p> </li> </ul>'
        ScalingType:
          allOf:
          - $ref: '#/components/schemas/ScalingType'
          - description: The scaling type. Uniform scaling creates shards of equal size.
        StreamARN:
          allOf:
          - $ref: '#/components/schemas/StreamARN'
          - description: The ARN of the stream.
    PositiveIntegerObject:
      type: integer
      minimum: 1
    ValidationException: {}
    UpdateShardCountOutput:
      type: object
      properties:
        StreamName:
          allOf:
          - $ref: '#/components/schemas/StreamName'
          - description: The name of the stream.
        CurrentShardCount:
          allOf:
          - $ref: '#/components/schemas/PositiveIntegerObject'
          - description: The current number of shards.
        TargetShardCount:
          allOf:
          - $ref: '#/components/schemas/PositiveIntegerObject'
          - description: The updated number of shards.
        StreamARN:
          allOf:
          - $ref: '#/components/schemas/StreamARN'
          - description: The ARN of the stream.
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
