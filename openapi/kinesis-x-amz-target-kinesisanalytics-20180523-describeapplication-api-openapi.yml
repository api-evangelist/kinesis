tags:
- name: '#X Amz Target=KinesisAnalytics 20180523.DescribeApplication'
paths:
  /#X-Amz-Target=KinesisAnalytics_20180523.DescribeApplication:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeApplication
      description: <p>Returns information about a specific Kinesis Data Analytics application.</p> <p>If you want to retrieve a list of all applications in your account, use the <a>ListApplications</a> operation.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeApplicationResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: InvalidArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentException'
        '482':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeApplicationRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - KinesisAnalytics_20180523.DescribeApplication
      tags:
      - '#X Amz Target=KinesisAnalytics 20180523.DescribeApplication'
components:
  schemas:
    CheckpointConfigurationDescription:
      type: object
      properties:
        ConfigurationType:
          allOf:
          - $ref: '#/components/schemas/ConfigurationType'
          - description: <p>Describes whether the application uses the default checkpointing behavior in Kinesis Data Analytics. </p> <note> <p>If this value is set to <code>DEFAULT</code>, the application will use the following values, even if they are set to other values using APIs or application code:</p> <ul> <li> <p> <b>CheckpointingEnabled:</b> true</p> </li> <li> <p> <b>CheckpointInterval:</b> 60000</p> </li> <li> <p> <b>MinPauseBetweenCheckpoints:</b> 5000</p> </li> </ul> </note>
        CheckpointingEnabled:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: <p>Describes whether checkpointing is enabled for a Flink-based Kinesis Data Analytics application.</p> <note> <p>If <code>CheckpointConfiguration.ConfigurationType</code> is <code>DEFAULT</code>, the application will use a <code>CheckpointingEnabled</code> value of <code>true</code>, even if this value is set to another value using this API or in application code.</p> </note>
        CheckpointInterval:
          allOf:
          - $ref: '#/components/schemas/CheckpointInterval'
          - description: <p>Describes the interval in milliseconds between checkpoint operations. </p> <note> <p>If <code>CheckpointConfiguration.ConfigurationType</code> is <code>DEFAULT</code>, the application will use a <code>CheckpointInterval</code> value of 60000, even if this value is set to another value using this API or in application code.</p> </note>
        MinPauseBetweenCheckpoints:
          allOf:
          - $ref: '#/components/schemas/MinPauseBetweenCheckpoints'
          - description: <p>Describes the minimum time in milliseconds after a checkpoint operation completes that a new checkpoint operation can start. </p> <note> <p>If <code>CheckpointConfiguration.ConfigurationType</code> is <code>DEFAULT</code>, the application will use a <code>MinPauseBetweenCheckpoints</code> value of 5000, even if this value is set using this API or in application code.</p> </note>
      description: Describes checkpointing parameters for a Flink-based Kinesis Data Analytics application.
    SecurityGroupIds:
      type: array
      items:
        $ref: '#/components/schemas/SecurityGroupId'
      minItems: 1
      maxItems: 5
    ApplicationName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 128
    ApplicationVersionId:
      type: integer
      minimum: 1
      maximum: 999999999
    JobPlanDescription:
      type: string
    BasePath:
      type: string
      pattern: '[a-zA-Z0-9/!-_.*''()]+'
      minLength: 1
      maxLength: 1024
    RecordRowPath:
      type: string
      pattern: ^(?=^\$)(?=^\S+$).*$
      minLength: 1
      maxLength: 65535
    RuntimeEnvironment:
      type: string
      enum:
      - SQL-1_0
      - FLINK-1_6
      - FLINK-1_8
      - ZEPPELIN-FLINK-1_0
      - FLINK-1_11
      - FLINK-1_13
      - ZEPPELIN-FLINK-2_0
      - FLINK-1_15
    DeployAsApplicationConfigurationDescription:
      type: object
      required:
      - S3ContentLocationDescription
      properties:
        S3ContentLocationDescription:
          allOf:
          - $ref: '#/components/schemas/S3ContentBaseLocationDescription'
          - description: The location that holds the data required to specify an Amazon Data Analytics application.
      description: The configuration information required to deploy an Amazon Data Analytics Studio notebook as an application with durable state.
    RecordColumnName:
      type: string
      pattern: '[^-\s<>&]*'
      minLength: 1
      maxLength: 256
    LogLevel:
      type: string
      enum:
      - INFO
      - WARN
      - ERROR
      - DEBUG
    KinesisFirehoseInputDescription:
      type: object
      required:
      - ResourceARN
      properties:
        ResourceARN:
          allOf:
          - $ref: '#/components/schemas/ResourceARN'
          - description: The Amazon Resource Name (ARN) of the delivery stream.
        RoleARN:
          allOf:
          - $ref: '#/components/schemas/RoleARN'
          - description: <p>The ARN of the IAM role that Kinesis Data Analytics assumes to access the stream.</p> <note> <p>Provided for backward compatibility. Applications that are created with the current API version have an application-level service execution role rather than a resource-level role.</p> </note>
      description: 'Describes the Amazon Kinesis Data Firehose delivery stream that is configured as the streaming source in the application input configuration. '
    OutputDescription:
      type: object
      properties:
        OutputId:
          allOf:
          - $ref: '#/components/schemas/Id'
          - description: A unique identifier for the output configuration.
        Name:
          allOf:
          - $ref: '#/components/schemas/InAppStreamName'
          - description: The name of the in-application stream that is configured as output.
        KinesisStreamsOutputDescription:
          allOf:
          - $ref: '#/components/schemas/KinesisStreamsOutputDescription'
          - description: Describes the Kinesis data stream that is configured as the destination where output is written.
        KinesisFirehoseOutputDescription:
          allOf:
          - $ref: '#/components/schemas/KinesisFirehoseOutputDescription'
          - description: Describes the Kinesis Data Firehose delivery stream that is configured as the destination where output is written.
        LambdaOutputDescription:
          allOf:
          - $ref: '#/components/schemas/LambdaOutputDescription'
          - description: Describes the Lambda function that is configured as the destination where output is written.
        DestinationSchema:
          allOf:
          - $ref: '#/components/schemas/DestinationSchema'
          - description: The data format used for writing data to the destination.
      description: 'For a SQL-based Kinesis Data Analytics application, describes the application output configuration, which includes the in-application stream name and the destination where the stream data is written. The destination can be a Kinesis data stream or a Kinesis Data Firehose delivery stream. '
    MonitoringConfigurationDescription:
      type: object
      properties:
        ConfigurationType:
          allOf:
          - $ref: '#/components/schemas/ConfigurationType'
          - description: Describes whether to use the default CloudWatch logging configuration for an application.
        MetricsLevel:
          allOf:
          - $ref: '#/components/schemas/MetricsLevel'
          - description: Describes the granularity of the CloudWatch Logs for an application.
        LogLevel:
          allOf:
          - $ref: '#/components/schemas/LogLevel'
          - description: Describes the verbosity of the CloudWatch Logs for an application.
      description: Describes configuration parameters for CloudWatch logging for an application.
    S3ReferenceDataSourceDescription:
      type: object
      required:
      - BucketARN
      - FileKey
      properties:
        BucketARN:
          allOf:
          - $ref: '#/components/schemas/BucketARN'
          - description: The Amazon Resource Name (ARN) of the S3 bucket.
        FileKey:
          allOf:
          - $ref: '#/components/schemas/FileKey'
          - description: Amazon S3 object key name.
        ReferenceRoleARN:
          allOf:
          - $ref: '#/components/schemas/RoleARN'
          - description: <p>The ARN of the IAM role that Kinesis Data Analytics can assume to read the Amazon S3 object on your behalf to populate the in-application reference table. </p> <note> <p>Provided for backward compatibility. Applications that are created with the current API version have an application-level service execution role rather than a resource-level role.</p> </note>
      description: For a SQL-based Kinesis Data Analytics application, provides the bucket name and object key name that stores the reference data.
    InputDescriptions:
      type: array
      items:
        $ref: '#/components/schemas/InputDescription'
    ApplicationRestoreConfiguration:
      type: object
      required:
      - ApplicationRestoreType
      properties:
        ApplicationRestoreType:
          allOf:
          - $ref: '#/components/schemas/ApplicationRestoreType'
          - description: Specifies how the application should be restored.
        SnapshotName:
          allOf:
          - $ref: '#/components/schemas/SnapshotName'
          - description: The identifier of an existing snapshot of application state to use to restart an application. The application uses this value if <code>RESTORE_FROM_CUSTOM_SNAPSHOT</code> is specified for the <code>ApplicationRestoreType</code>.
      description: Specifies the method and snapshot to use when restarting an application using previously saved application state.
    MavenArtifactId:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 256
    VpcId:
      type: string
    ConditionalToken:
      type: string
      pattern: '[a-zA-Z0-9-_+/=]+'
      minLength: 1
      maxLength: 512
    RecordFormatType:
      type: string
      enum:
      - JSON
      - CSV
    InvalidRequestException: {}
    ArtifactType:
      type: string
      enum:
      - UDF
      - DEPENDENCY_JAR
    ParallelismPerKPU:
      type: integer
      minimum: 1
    ZeppelinApplicationConfigurationDescription:
      type: object
      required:
      - MonitoringConfigurationDescription
      properties:
        MonitoringConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/ZeppelinMonitoringConfigurationDescription'
          - description: The monitoring configuration of a Kinesis Data Analytics Studio notebook.
        CatalogConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/CatalogConfigurationDescription'
          - description: The Amazon Glue Data Catalog that is associated with the Kinesis Data Analytics Studio notebook.
        DeployAsApplicationConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/DeployAsApplicationConfigurationDescription'
          - description: The parameters required to deploy a Kinesis Data Analytics Studio notebook as an application with durable state.
        CustomArtifactsConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/CustomArtifactsConfigurationDescriptionList'
          - description: Custom artifacts are dependency JARs and user-defined functions (UDF).
      description: The configuration of a Kinesis Data Analytics Studio notebook.
    S3ApplicationCodeLocationDescription:
      type: object
      required:
      - BucketARN
      - FileKey
      properties:
        BucketARN:
          allOf:
          - $ref: '#/components/schemas/BucketARN'
          - description: The Amazon Resource Name (ARN) for the S3 bucket containing the application code.
        FileKey:
          allOf:
          - $ref: '#/components/schemas/FileKey'
          - description: The file key for the object containing the application code.
        ObjectVersion:
          allOf:
          - $ref: '#/components/schemas/ObjectVersion'
          - description: The version of the object containing the application code.
      description: Describes the location of an application's code stored in an S3 bucket.
    RunConfigurationDescription:
      type: object
      properties:
        ApplicationRestoreConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/ApplicationRestoreConfiguration'
          - description: Describes the restore behavior of a restarting application.
        FlinkRunConfigurationDescription:
          $ref: '#/components/schemas/FlinkRunConfiguration'
      description: Describes the starting properties for a Kinesis Data Analytics application.
    CheckpointInterval:
      type: integer
      minimum: 1
    RecordFormat:
      type: object
      required:
      - RecordFormatType
      properties:
        RecordFormatType:
          allOf:
          - $ref: '#/components/schemas/RecordFormatType'
          - description: The type of record format.
        MappingParameters:
          allOf:
          - $ref: '#/components/schemas/MappingParameters'
          - description: When you configure application input at the time of creating or updating an application, provides additional mapping information specific to the record format (such as JSON, CSV, or record fields delimited by some delimiter) on the streaming source.
      description: ' For a SQL-based Kinesis Data Analytics application, describes the record format and relevant mapping information that should be applied to schematize the records on the stream. '
    ZeppelinMonitoringConfigurationDescription:
      type: object
      properties:
        LogLevel:
          allOf:
          - $ref: '#/components/schemas/LogLevel'
          - description: Describes the verbosity of the CloudWatch Logs for an application.
      description: The monitoring configuration for Apache Zeppelin within a Kinesis Data Analytics Studio notebook.
    JSONMappingParameters:
      type: object
      required:
      - RecordRowPath
      properties:
        RecordRowPath:
          allOf:
          - $ref: '#/components/schemas/RecordRowPath'
          - description: The path to the top-level parent that contains the records.
      description: For a SQL-based Kinesis Data Analytics application, provides additional mapping information when JSON is the record format on the streaming source.
    KinesisFirehoseOutputDescription:
      type: object
      required:
      - ResourceARN
      properties:
        ResourceARN:
          allOf:
          - $ref: '#/components/schemas/ResourceARN'
          - description: The Amazon Resource Name (ARN) of the delivery stream.
        RoleARN:
          allOf:
          - $ref: '#/components/schemas/RoleARN'
          - description: <p>The ARN of the IAM role that Kinesis Data Analytics can assume to access the stream.</p> <note> <p>Provided for backward compatibility. Applications that are created with the current API version have an application-level service execution role rather than a resource-level role.</p> </note>
      description: For a SQL-based Kinesis Data Analytics application's output, describes the Kinesis Data Firehose delivery stream that is configured as its destination.
    MappingParameters:
      type: object
      properties:
        JSONMappingParameters:
          allOf:
          - $ref: '#/components/schemas/JSONMappingParameters'
          - description: Provides additional mapping information when JSON is the record format on the streaming source.
        CSVMappingParameters:
          allOf:
          - $ref: '#/components/schemas/CSVMappingParameters'
          - description: Provides additional mapping information when the record format uses delimiters (for example, CSV).
      description: When you configure a SQL-based Kinesis Data Analytics application's input at the time of creating or updating an application, provides additional mapping information specific to the record format (such as JSON, CSV, or record fields delimited by some delimiter) on the streaming source.
    EnvironmentPropertyDescriptions:
      type: object
      properties:
        PropertyGroupDescriptions:
          allOf:
          - $ref: '#/components/schemas/PropertyGroups'
          - description: Describes the execution property groups.
      description: Describes the execution properties for an Apache Flink runtime.
    RecordColumns:
      type: array
      items:
        $ref: '#/components/schemas/RecordColumn'
      minItems: 1
      maxItems: 1000
    ConfigurationType:
      type: string
      enum:
      - DEFAULT
      - CUSTOM
    InputStartingPosition:
      type: string
      enum:
      - NOW
      - TRIM_HORIZON
      - LAST_STOPPED_POINT
    ParallelismConfigurationDescription:
      type: object
      properties:
        ConfigurationType:
          allOf:
          - $ref: '#/components/schemas/ConfigurationType'
          - description: 'Describes whether the application uses the default parallelism for the Kinesis Data Analytics service. '
        Parallelism:
          allOf:
          - $ref: '#/components/schemas/Parallelism'
          - description: Describes the initial number of parallel tasks that a Flink-based Kinesis Data Analytics application can perform. If <code>AutoScalingEnabled</code> is set to True, then Kinesis Data Analytics can increase the <code>CurrentParallelism</code> value in response to application load. The service can increase <code>CurrentParallelism</code> up to the maximum parallelism, which is <code>ParalellismPerKPU</code> times the maximum KPUs for the application. The maximum KPUs for an application is 32 by default, and can be increased by requesting a limit increase. If application load is reduced, the service can reduce the <code>CurrentParallelism</code> value down to the <code>Parallelism</code> setting.
        ParallelismPerKPU:
          allOf:
          - $ref: '#/components/schemas/ParallelismPerKPU'
          - description: Describes the number of parallel tasks that a Flink-based Kinesis Data Analytics application can perform per Kinesis Processing Unit (KPU) used by the application.
        CurrentParallelism:
          allOf:
          - $ref: '#/components/schemas/Parallelism'
          - description: Describes the current number of parallel tasks that a Flink-based Kinesis Data Analytics application can perform. If <code>AutoScalingEnabled</code> is set to True, Kinesis Data Analytics can increase this value in response to application load. The service can increase this value up to the maximum parallelism, which is <code>ParalellismPerKPU</code> times the maximum KPUs for the application. The maximum KPUs for an application is 32 by default, and can be increased by requesting a limit increase. If application load is reduced, the service can reduce the <code>CurrentParallelism</code> value down to the <code>Parallelism</code> setting.
        AutoScalingEnabled:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Describes whether the Kinesis Data Analytics service can increase the parallelism of the application in response to increased throughput.
      description: Describes parameters for how a Flink-based Kinesis Data Analytics application executes multiple tasks simultaneously.
    S3ContentLocation:
      type: object
      required:
      - BucketARN
      - FileKey
      properties:
        BucketARN:
          allOf:
          - $ref: '#/components/schemas/BucketARN'
          - description: The Amazon Resource Name (ARN) for the S3 bucket containing the application code.
        FileKey:
          allOf:
          - $ref: '#/components/schemas/FileKey'
          - description: The file key for the object containing the application code.
        ObjectVersion:
          allOf:
          - $ref: '#/components/schemas/ObjectVersion'
          - description: The version of the object containing the application code.
      description: 'For a Kinesis Data Analytics application provides a description of an Amazon S3 object, including the Amazon Resource Name (ARN) of the S3 bucket, the name of the Amazon S3 object that contains the data, and the version number of the Amazon S3 object that contains the data. '
    ResourceARN:
      type: string
      pattern: arn:.*
      minLength: 1
      maxLength: 2048
    TextContent:
      type: string
      minLength: 0
      maxLength: 102400
    FlinkApplicationConfigurationDescription:
      type: object
      properties:
        CheckpointConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/CheckpointConfigurationDescription'
          - description: Describes an application's checkpointing configuration. Checkpointing is the process of persisting application state for fault tolerance.
        MonitoringConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/MonitoringConfigurationDescription'
          - description: Describes configuration parameters for Amazon CloudWatch logging for an application.
        ParallelismConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/ParallelismConfigurationDescription'
          - description: Describes parameters for how an application executes multiple tasks simultaneously.
        JobPlanDescription:
          allOf:
          - $ref: '#/components/schemas/JobPlanDescription'
          - description: The job plan for an application. For more information about the job plan, see <a href="https://ci.apache.org/projects/flink/flink-docs-release-1.8/internals/job_scheduling.html">Jobs and Scheduling</a> in the <a href="https://ci.apache.org/projects/flink/flink-docs-release-1.8/">Apache Flink Documentation</a>. To retrieve the job plan for the application, use the <a>DescribeApplicationRequest$IncludeAdditionalDetails</a> parameter of the <a>DescribeApplication</a> operation.
      description: Describes configuration parameters for a Flink-based Kinesis Data Analytics application.
    CustomArtifactsConfigurationDescriptionList:
      type: array
      items:
        $ref: '#/components/schemas/CustomArtifactConfigurationDescription'
      maxItems: 50
    DestinationSchema:
      type: object
      required:
      - RecordFormatType
      properties:
        RecordFormatType:
          allOf:
          - $ref: '#/components/schemas/RecordFormatType'
          - description: Specifies the format of the records on the output stream.
      description: 'Describes the data format when records are written to the destination in a SQL-based Kinesis Data Analytics application. '
    GlueDataCatalogConfigurationDescription:
      type: object
      required:
      - DatabaseARN
      properties:
        DatabaseARN:
          allOf:
          - $ref: '#/components/schemas/DatabaseARN'
          - description: The Amazon Resource Name (ARN) of the database.
      description: The configuration of the Glue Data Catalog that you use for Apache Flink SQL queries and table API transforms that you write in an application.
    VpcConfigurationDescription:
      type: object
      required:
      - VpcConfigurationId
      - VpcId
      - SubnetIds
      - SecurityGroupIds
      properties:
        VpcConfigurationId:
          allOf:
          - $ref: '#/components/schemas/Id'
          - description: The ID of the VPC configuration.
        VpcId:
          allOf:
          - $ref: '#/components/schemas/VpcId'
          - description: The ID of the associated VPC.
        SubnetIds:
          allOf:
          - $ref: '#/components/schemas/SubnetIds'
          - description: The array of <a href="https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_Subnet.html">Subnet</a> IDs used by the VPC configuration.
        SecurityGroupIds:
          allOf:
          - $ref: '#/components/schemas/SecurityGroupIds'
          - description: The array of <a href="https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_SecurityGroup.html">SecurityGroup</a> IDs used by the VPC configuration.
      description: Describes the parameters of a VPC used by the application.
    SnapshotName:
      type: string
      pattern: '[a-zA-Z0-9_.-]+'
      minLength: 1
      maxLength: 256
    ApplicationConfigurationDescription:
      type: object
      properties:
        SqlApplicationConfigurationDescription:
          allOf:
          - $ref: '#/components/schemas/SqlApplicationConfigurationDescription'
